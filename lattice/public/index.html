<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lattice</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='none' stroke='%238b7cf6' stroke-width='2.4'%3E%3Cpath d='M16 3 29 16 16 29 3 16Z'/%3E%3Cpath d='M16 3v26M3 16h26' stroke-width='1.4' opacity='.6'/%3E%3C/g%3E%3C/svg%3E">
  <script>
    try {
      const t = localStorage.getItem('lattice.theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="preload" href="/vendor/katex/fonts/KaTeX_Main-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/vendor/katex/fonts/KaTeX_Math-Italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/vendor/katex/katex.min.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Lattice home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3 29 16 16 29 3 16Z"/><path class="brand-cross" d="M16 3v26M3 16h26"/></svg>
      <span>Lattice</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="#/" data-nav="home">Explore</a>
      <a href="#/learn" data-nav="learn" data-route-nav hidden>Path</a>
      <a href="#/library" data-nav="library">Library</a>
      <a href="#/graph" data-nav="graph">Graph</a>
      <a href="#/questions" data-nav="questions" title="Your questions"><svg class="nav-q-icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.5"/><path d="M7.8 7.8a2.3 2.3 0 1 1 3.2 2.1c-.6.3-1 .8-1 1.5v.4M10 14.4v.1"/></svg><span class="nav-label">Questions</span><span class="nav-count" data-open-questions hidden></span></a>
    </nav>
    <button class="search-trigger" type="button" data-action="palette">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4.5 4.5"/></svg>
      <span>Search or jump to…</span>
      <kbd>/</kbd>
    </button>
    <div class="topbar-actions">
      <a class="btn btn-primary" href="#/new" title="New entry (n)">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>
        <span>New</span>
      </a>
      <button class="icon-btn" type="button" data-action="theme" title="Toggle light / dark" aria-label="Toggle theme">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5a7.5 7.5 0 1 0 0 15z" class="fill"/><circle cx="10" cy="10" r="7.5"/></svg>
      </button>
      <a class="icon-btn" href="#/settings" data-nav="settings" title="Settings, areas and data" aria-label="Settings">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="2.6"/><path d="M10 2v2.2M10 15.8V18M2 10h2.2M15.8 10H18M4.3 4.3l1.6 1.6M14.1 14.1l1.6 1.6M4.3 15.7l1.6-1.6M14.1 5.9l1.6-1.6"/></svg>
      </a>
    </div>
  </header>

  <main id="view" tabindex="-1">
    <div class="boot">Loading your lattice…</div>
  </main>

  <div id="toasts" aria-live="polite"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
